worker_processes 1;

events {
  worker_connections 1024;
}

http {
  gzip on; # Enables compression, incl Web API content-types
  gzip_types
    "application/json;charset=utf-8" application/json
    "application/javascript;charset=utf-8" application/javascript text/javascript
    "application/xml;charset=utf-8" application/xml text/xml
    "text/css;charset=utf-8" text/css
    "text/plain;charset=utf-8" text/plain;

  upstream dhis2 {
    server dhis2:8080 max_fails=3 fail_timeout=60s;
  }

  upstream nehr {
    server ehr:8080 max_fails=3 fail_timeout=60s;
  }

  upstream esignet-ui {
    server esignet-ui:4000 max_fails=3 fail_timeout=60s;
  }

  # HTTP server - rewrite to force use of SSL
  server {
    listen     80;
    rewrite    ^ https://dhis2.mec.mosip.net$request_uri? permanent;
  }

  # HTTPS server
  server {
    listen               443 ssl;
    client_max_body_size 10M;

    ssl_certificate      /dhis2-mec-fullchain.pem;
    ssl_certificate_key  /dhis2-mec-privkey.pem;

    ssl_session_cache shared:le_nginx_SSL:10m;
    ssl_session_timeout 1440m;
    ssl_session_tickets off;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    ssl_ciphers "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384";

    # Proxy pass to servlet container
    location / {
      proxy_pass                http://dhis2/;
      proxy_redirect            off;
      proxy_set_header          Host               $host;
      proxy_set_header          X-Real-IP          $remote_addr;
      proxy_set_header          X-Forwarded-For    $proxy_add_x_forwarded_for;
      proxy_set_header          X-Forwarded-Proto  https;
      proxy_buffer_size         128k;
      proxy_buffers             8 128k;
      proxy_busy_buffers_size   256k;
      proxy_cookie_path         ~*^/(.*) "/$1; SameSite=Lax";
    }

    location /nehr/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://nehr/;

      sub_filter_types text/html;
      sub_filter_once off;
      sub_filter 'href="/'  'href="/nehr/';
      sub_filter 'src="/'   'src="/nehr/';
    }

    location /esignet/ {
      proxy_set_header Host $http_host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_pass http://esignet-ui/;
    }
  }
}